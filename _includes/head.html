{% include base_path %}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!--
  Resolve the colour theme before the stylesheet is parsed so the first paint
  already uses the right palette. An explicit choice wins; otherwise the operating
  system preference is followed. With scripting disabled the stylesheet media query
  still honours the system preference.
-->
<script>
  (function () {
    var theme;
    try {
      theme = window.localStorage.getItem('theme');
    } catch (e) {
      theme = null;
    }
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
